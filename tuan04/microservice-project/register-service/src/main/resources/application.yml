server:
  port: 8081

spring:
  application:
    name: register-service

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:registerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console (truy cập http://localhost:8081/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example.register: DEBUG
    org.springframework.security: INFO
