server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


# Feign
feign:
  circuitbreaker:
    enabled: true

# Resilience4j cho inter-service calls
resilience4j:
  circuitbreaker:
    instances:
      orderService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

  retry:
    instances:
      orderService:
        maxAttempts: 3
        waitDuration: 500ms

  ratelimiter:
    instances:
      orderService:
        limitForPeriod: 2      # Chỉ cho 2 request
        limitRefreshPeriod: 10s # Trong 10 giây
        timeoutDuration: 0     # Không chờ

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microservices.order: DEBUG
    io.github.resilience4j: DEBUG