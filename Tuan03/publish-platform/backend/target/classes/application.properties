# ── application.properties ──────────────────────────────────────
server.port=8080
spring.application.name=publish-platform

# Database (H2 cho dev, đổi sang PostgreSQL cho production)
spring.datasource.url=jdbc:h2:file:./data/publishdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Media upload
media.upload-dir=uploads
media.base-url=http://localhost:8080/api/files
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS
spring.web.cors.allowed-origins=http://localhost:3000
